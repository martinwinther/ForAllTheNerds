<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="ForAllTheNerds: an open book with a location pin above it">
  <defs>
    <linearGradient id="plate" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1b1b24"/>
      <stop offset="1" stop-color="#0a0a0e"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.40" r="0.46">
      <stop offset="0" stop-color="#ffd100" stop-opacity="0.15"/>
      <stop offset="1" stop-color="#ffd100" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="leftPage" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#e4d3ad"/>
      <stop offset="1" stop-color="#f6ecd6"/>
    </linearGradient>
    <linearGradient id="rightPage" x1="1" y1="0" x2="0" y2="0">
      <stop offset="0" stop-color="#e4d3ad"/>
      <stop offset="1" stop-color="#f6ecd6"/>
    </linearGradient>
  </defs>

  <!-- plate -->
  <rect width="512" height="512" rx="104" fill="url(#plate)"/>
  <rect width="512" height="512" rx="104" fill="url(#glow)"/>
  <rect x="5" y="5" width="502" height="502" rx="100" fill="none" stroke="#ffd100" stroke-opacity="0.26" stroke-width="7"/>

  <!-- location pin -->
  <g>
    <path d="M 216.2 182.4 A 52 52 0 1 1 295.8 182.4 L 256 256 Z" fill="#ffd100"/>
    <circle cx="256" cy="150" r="18.5" fill="#12121a"/>
  </g>

  <!-- book: page block shadow, then the two page faces -->
  <g>
    <path d="M256 322 C216 298 152 282 94 286 L94 368 C152 364 216 378 256 400 Z" fill="#a8863c"/>
    <path d="M256 322 C296 298 360 282 418 286 L418 368 C360 364 296 378 256 400 Z" fill="#8f7033"/>

    <path d="M256 308 C216 284 152 268 94 272 L94 348 C152 344 216 358 256 382 Z" fill="url(#leftPage)"/>
    <path d="M256 308 C296 284 360 268 418 272 L418 348 C360 344 296 358 256 382 Z" fill="url(#rightPage)"/>

    <!-- lines of text on the pages -->
    <g stroke="#a08d5c" stroke-width="10" stroke-linecap="round" opacity="0.85">
      <path d="M130 302 C168 300 208 308 238 324"/>
      <path d="M130 328 C168 326 208 334 238 350"/>
      <path d="M382 302 C344 300 304 308 274 324"/>
      <path d="M382 328 C344 326 304 334 274 350"/>
    </g>

    <!-- spine -->
    <path d="M256 308 L256 382" stroke="#6f5526" stroke-width="11" stroke-linecap="round"/>
  </g>
</svg>
