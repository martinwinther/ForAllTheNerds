# Checks on work in progress. This never uploads anything anywhere: the only
# workflow that publishes is release.yml, and that one fires on tags alone.
#
# Releases ran the validator for the first time at tag time, which is the worst
# moment to find out something is broken, because the tag is already pushed.
# This runs the same checks on every push to a working branch, and on anything
# proposed for main.

name: Checks

on:
  push:
    branches:
      - dev
      - 'dev/**'
      - 'feature/**'
  pull_request:
    branches:
      - main

permissions:
  contents: read   # reads the code, publishes nothing

jobs:
  validate:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false   # report every broken client config, not just the first
      matrix:
        include:
          - name: Forever (interface 16001)
            env: ''
          - name: Classic Era (interface 11509)
            env: 'FTN_PROJECT_ID=2 FTN_TOC=11509'
          - name: no UI templates
            env: 'FTN_NO_TEMPLATES=1'
          - name: no Settings API
            env: 'FTN_NO_SETTINGS=1'
          - name: neither templates nor Settings API
            env: 'FTN_NO_SETTINGS=1 FTN_NO_TEMPLATES=1'
          - name: legacy options panel
            env: 'FTN_LEGACY_OPTIONS=1'
          - name: no C_Secrets probe
            env: 'FTN_NO_SECRET_PROBE=1'
          - name: no UnitIsPlayer
            env: 'FTN_NO_UNITISPLAYER=1'
          - name: no C_Map.GetAreaInfo
            env: 'FTN_NO_AREAINFO=1'
    name: ${{ matrix.name }}
    steps:
      - name: Check out
        uses: actions/checkout@v7

      - name: Install Lua
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq lua5.4

      - name: Validate
        run: env ${{ matrix.env }} lua5.4 tools/validate.lua
