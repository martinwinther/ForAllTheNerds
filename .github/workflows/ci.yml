# Checks on work in progress. This never uploads anything anywhere: the only
# workflow that publishes is release.yml, and that one fires on tags alone.
#
# Releases ran the validator for the first time at tag time, which is the worst
# moment to find out something is broken, because the tag is already pushed.
# This runs the same checks on every push to a working branch, and on anything
# proposed for main.

name: Checks

on:
  push:
    branches:
      - dev
      - 'dev/**'
      - 'feature/**'
  pull_request:
    branches:
      - main

permissions:
  contents: read   # reads the code, publishes nothing

jobs:
  validate:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false   # report every broken client config, not just the first
      matrix:
        include:
          - name: Forever (interface 16001)
            env: ''
          - name: Classic Era (interface 11509)
            env: 'FTN_PROJECT_ID=2 FTN_TOC=11509'
          - name: no UI templates
            env: 'FTN_NO_TEMPLATES=1'
          - name: no Settings API
            env: 'FTN_NO_SETTINGS=1'
          - name: neither templates nor Settings API
            env: 'FTN_NO_SETTINGS=1 FTN_NO_TEMPLATES=1'
          - name: legacy options panel
            env: 'FTN_LEGACY_OPTIONS=1'
          # Three configurations were dropped in 1.2.21: no C_Secrets probe, no
          # UnitIsPlayer and no C_Map.GetAreaInfo. Each existed to prove the NPC
          # roster and the AreaTable scan coped on a client missing the API they
          # needed. Both features are gone, nothing in the addon reads those
          # APIs any more, and a configuration that exercises nothing is worse
          # than no configuration: it reports green without testing anything.
    name: ${{ matrix.name }}
    steps:
      - name: Check out
        uses: actions/checkout@v7

      # Drop the third-party apt sources the runner image carries and this job
      # does not need. On 2026-11-27 packages.microsoft.com answered 403 and
      # apt called the repository "no longer signed", which failed the whole
      # job at release 1.2.24 with nothing wrong in the addon.
      - name: Install Lua
        run: |
          sudo rm -f /etc/apt/sources.list.d/*microsoft*
          sudo apt-get update -qq
          sudo apt-get install -y -qq lua5.4

      - name: Validate
        run: env ${{ matrix.env }} lua5.4 tools/validate.lua

  docs:
    runs-on: ubuntu-latest
    name: Gap docs agree
    steps:
      - name: Check out
        uses: actions/checkout@v7

      # The check loads the addon, so it needs a Lua interpreter. Ubuntu
      # installs it as lua5.4 and provides no plain `lua`; tools/addon_entries.py
      # tries both names. The rm is there for the same reason as in the other
      # job: a third-party apt source answering 403 should not fail this.
      - name: Install Lua
        run: |
          sudo rm -f /etc/apt/sources.list.d/*microsoft*
          sudo apt-get update -qq
          sudo apt-get install -y -qq lua5.4

      # tools/coverage.md is generated and tools/no-source.md is written by
      # hand. This fails if a gap has no reason at all, if a reason outlived
      # its gap, or if a place listed as empty turns out to have an entry
      # already. That last one is why the check reads the addon and not just
      # the two files: on 2026-11-28 both of them were stale in the same
      # direction and agreed with each other anyway.
      - name: Check the gap docs against each other and against the addon
        run: python3 -I tools/check-gaps.py
